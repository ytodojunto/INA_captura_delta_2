name: Sincronizar API INA (Corrientes -> delta -> RDP)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC diario, una vez que este al dia

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # deja margen bajo el limite de 360 min de GH Actions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Correr sincronizacion
        run: python sincronizar_ina.py

      - name: Commitear resultados
        if: always()  # commitear el avance aunque el paso anterior se haya cortado por tiempo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Sync API INA $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
