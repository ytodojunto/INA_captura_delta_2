name: Capturar pronostico INA (cada ~30 min, solo corridas nuevas)

on:
  workflow_dispatch:
  schedule:
    # Antes: una vez por dia a las 13:00 UTC, pero GitHub la corria con 3-8 h de demora y la
    # primera captura de cada corrida llegaba 13-21 h despues de su t0. Ahora dos disparos por
    # hora; el script no guarda nada si no hay corrida nueva, asi que no se duplican snapshots.
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: capturar-prono
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Correr captura
        run: python capturar_prono_ina.py

      - name: Commitear resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot_actual.json data/historico_prono/
          git diff --staged --quiet || git commit -m "Captura prono INA $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
