name: Capturar pronostico INA (diario)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"  # 13:00 UTC diario (~10hs Arg), despues de que corran los modelos de la manana

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Correr captura
        run: python capturar_prono_ina.py

      - name: Commitear resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot_actual.json data/historico_prono/
          git diff --staged --quiet || git commit -m "Captura prono INA $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
