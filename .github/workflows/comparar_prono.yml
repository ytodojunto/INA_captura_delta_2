name: Comparar pronostico INA vs observado

on:
  workflow_dispatch:
  schedule:
    # 14:30 UTC diario: despues de "Capturar pronostico INA" (13:00 UTC)
    # y del sync de series, asi compara con datos frescos.
    - cron: "30 14 * * *"

permissions:
  contents: write

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Correr comparacion v4 (snapshots propios, sin red)
        run: python comparar_prono_ina_v4.py

      - name: Commitear resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/comparacion_prono/comparacion.json
          git diff --staged --quiet || git commit -m "Comparacion prono INA v4 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
