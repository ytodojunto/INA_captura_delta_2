name: Comparar pronostico INA vs observado

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comparar-prono
  cancel-in-progress: false

jobs:
  comparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comparar (v5)
        run: python comparar_prono_ina_v5.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/comparacion_prono/comparacion.json
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "comparacion INA v5 $(date -u +%F)"
          git pull --rebase
          git push
